petstore:
  service:
    pet:
     url: ${PETSTOREPETSERVICE_URL:http://localhost:8081}
    product:
      url: ${PETSTOREPRODUCTSERVICE_URL:http://localhost:8082}
    order:
      url: ${PETSTOREORDERSERVICE_URL:http://localhost:8083}
  security:
    # Enable this together with 'cloud.azure.active-directory.b2c.enabled = true' in Module 10
    enabled: ${PETSTORE_SECURITY_ENABLED:false}
server:
  port: ${PETSTOREAPP_SERVER_PORT:8080}
  forward-headers-strategy: native
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    ssl:
      enabled: false
    diskspace:
      enabled: false
    applicationinsights:
      enabled: false
    security:
      enabled: false
spring:
  application:
    name: petstoreapp
  thymeleaf:
    cache: false
  cache:
    cache-names: currentUsers
  cloud:
    discovery:
      enabled: false
    refresh:
      enabled: false
    azure:
      active-directory:
        b2c:
          # Enable this together with 'petstore.service.security.enabled = true' in Module 10
          enabled: ${PETSTOREAPP_B2C_ENABLED:false}
          profile:
            tenant-id: ${PETSTOREAPP_B2C_TENANT_ID}
          base-uri: ${PETSTOREAPP_B2C_BASE_URI}
          credential:
            client-id: ${PETSTOREAPP_B2C_CLIENT_ID}
            client-secret: '${PETSTOREAPP_B2C_CLIENT_SECRET}'
          login-flow: sign-up-or-sign-in
          logout-success-url: ${PETSTOREAPP_B2C_LOGOUT_SUCCESS_URL}
          user-flows:
            sign-up-or-sign-in: ${PETSTOREAPP_B2C_SIGNIN_SIGNUP_FLOW}
            profile-edit: ${PETSTOREAPP_B2C_PROFILE_EDIT_FLOW}
            password-reset: ${PETSTOREAPP_B2C_PASSWORD_RESET_FLOW}
          # Add base-uri, client-id, client-secret, login-flow, logout-success-url, and user-flows
logging:
  level:
    root: INFO
    com.chtrembl.petstoreapp: INFO
    com.azure.monitor.opentelemetry.autoconfigure.implementation.quickpulse.QuickPulsePingSender: ERROR
    com.azure.core.http.netty.NettyAsyncHttpClient: ERROR